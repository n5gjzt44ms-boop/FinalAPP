<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 440" role="img" aria-label="Transmetteur 4-20 milliampères à raccorder à la batterie, à la broche du module ou à la masse">
<rect width="900" height="440" fill="#FFFFFF"/>
<g font-family="Arial,Helvetica,sans-serif">
<text x="450" y="46" font-size="30" fill="#124A80" text-anchor="middle" font-weight="700">Transmetteur 4-20 mA : quel raccordement ?</text><rect x="70" y="150" width="240" height="170" fill="#E8E4DA" rx="10" stroke="#141414" stroke-width="4"/><text x="190" y="244" font-size="26" fill="#141414" text-anchor="middle" font-weight="700">Transmetteur</text><text x="345" y="195" font-size="36" fill="#C13B3A" text-anchor="middle" font-weight="700">+</text><text x="345" y="295" font-size="36" fill="#141414" text-anchor="middle" font-weight="700">−</text><rect x="590" y="90" width="240" height="80" fill="#E8E4DA" rx="10" stroke="#141414" stroke-width="4"/><text x="710" y="139" font-size="26" fill="#C13B3A" text-anchor="middle" font-weight="700">+ Batterie</text><rect x="590" y="210" width="240" height="80" fill="#E8E4DA" rx="10" stroke="#141414" stroke-width="4"/><text x="710" y="259" font-size="26" fill="#141414" text-anchor="middle" font-weight="700">Broche du module</text><rect x="590" y="330" width="240" height="80" fill="#E8E4DA" rx="10" stroke="#141414" stroke-width="4"/><text x="710" y="379" font-size="26" fill="#141414" text-anchor="middle" font-weight="700">Masse capteur</text><line x1="365" y1="185" x2="540" y2="185" stroke="#141414" stroke-width="5" stroke-linecap="round" stroke-dasharray="12 10"/><line x1="365" y1="285" x2="540" y2="285" stroke="#141414" stroke-width="5" stroke-linecap="round" stroke-dasharray="12 10"/><text x="460" y="245" font-size="44" fill="#C13B3A" text-anchor="middle" font-weight="700">?</text>
</g>
</svg>
