stroke-linecap="round"/><path d="M 598 210 Q 610 200 620 210" stroke="#C13B3A" stroke-width="1.4" fill="url(#hr)" stroke-linejoin="round" stroke-linecap="round"/><path d="M 552 232 q 6 16 12 0 Z" stroke="#C13B3A" stroke-width="1.4" fill="url(#hr)" stroke-linejoin="round" stroke-linecap="round"/><path d="M 594 232 q 6 16 12 0 Z" stroke="#C13B3A" stroke-width="1.4" fill="url(#hr)" stroke-linejoin="round" stroke-linecap="round"/><text x="760" y="104" font-size="26" text-anchor="middle" fill="#124A80" font-weight="700">D</text><rect x="690" y="190" width="85" height="60" stroke="#141414" stroke-width="3.2" fill="url(#h)"/><rect x="781" y="190" width="85" height="60" stroke="#141414" stroke-width="3.2" fill="url(#h2)"/><path d="M 760 190 Q 778 170 796 190 L 790 212 L 766 212 Z" stroke="#C13B3A" stroke-width="1.6" fill="url(#hr)" stroke-linejoin="round" stroke-linecap="round"/><polyline points="778,212 778,250" stroke="#141414" stroke-width="2.4" fill="none" stroke-linejoin="round" stroke-linecap="round"/><text x="105" y="300" font-size="17" text-anchor="middle" fill="#141414">cordon</text><text x="325" y="300" font-size="17" text-anchor="middle" fill="#141414">chanfrein</text><text x="575" y="300" font-size="17" text-anchor="middle" fill="#141414">tôle fine</text><text x="778" y="300" font-size="17" text-anchor="middle" fill="#141414">tôle de 12 mm</text><text x="450" y="380" font-size="19" text-anchor="middle" fill="#185FA5">Coupes de cordons après soudage. Défauts à reconnaître.</text>
<text x="886" y="408" font-size="15" text-anchor="end" fill="#6B6B6B">Dessin ISO 128</text>
