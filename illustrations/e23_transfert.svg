"round" stroke-linecap="round"/><polygon points="750,236 728,326 772,326" stroke="#C9A227" stroke-width="1.2" fill="#FFF4CC" stroke-linejoin="round" stroke-linecap="round"/><circle cx="746" cy="250" r="3" stroke="#185FA5" stroke-width="0.5" fill="#185FA5"/><circle cx="750" cy="258" r="3" stroke="#185FA5" stroke-width="0.5" fill="#185FA5"/><circle cx="754" cy="266" r="3" stroke="#185FA5" stroke-width="0.5" fill="#185FA5"/><circle cx="746" cy="274" r="3" stroke="#185FA5" stroke-width="0.5" fill="#185FA5"/><circle cx="750" cy="282" r="3" stroke="#185FA5" stroke-width="0.5" fill="#185FA5"/><circle cx="754" cy="290" r="3" stroke="#185FA5" stroke-width="0.5" fill="#185FA5"/><circle cx="746" cy="298" r="3" stroke="#185FA5" stroke-width="0.5" fill="#185FA5"/><circle cx="750" cy="306" r="3" stroke="#185FA5" stroke-width="0.5" fill="#185FA5"/><circle cx="754" cy="314" r="3" stroke="#185FA5" stroke-width="0.5" fill="#185FA5"/><text x="150" y="410" font-size="18" text-anchor="middle" fill="#141414">le fil touche le bain</text><text x="450" y="410" font-size="18" text-anchor="middle" fill="#141414">grosses gouttes</text><text x="750" y="410" font-size="18" text-anchor="middle" fill="#141414">fines gouttelettes</text><text x="450" y="460" font-size="20" text-anchor="middle" fill="#C13B3A" font-weight="700">Tôle, position et gaz décident du mode : ?</text>
<text x="886" y="478" font-size="15" text-anchor="end" fill="#6B6B6B">Dessin ISO 128</text>
