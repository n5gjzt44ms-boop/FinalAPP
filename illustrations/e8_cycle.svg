<g font-family="Arial,Helvetica,sans-serif">
<text x="450" y="46" font-size="30" fill="#124A80" text-anchor="middle" font-weight="700">Cycle de freinage</text><line x1="90" y1="340" x2="840" y2="340" stroke="#141414" stroke-width="5" stroke-linecap="round"/><line x1="90" y1="340" x2="90" y2="90" stroke="#141414" stroke-width="5" stroke-linecap="round"/><text x="70" y="110" font-size="28" fill="#141414" text-anchor="middle" font-weight="700">P</text><rect x="170" y="150" width="110" height="190" fill="#C13B3A"/><rect x="650" y="150" width="110" height="190" fill="#C13B3A"/><text x="225" y="130" font-size="32" fill="#C13B3A" text-anchor="middle" font-weight="700">tb</text><line x1="170" y1="400" x2="650" y2="400" stroke="#124A80" stroke-width="5" stroke-linecap="round"/><line x1="170" y1="380" x2="170" y2="420" stroke="#124A80" stroke-width="5" stroke-linecap="round"/><line x1="650" y1="380" x2="650" y2="420" stroke="#124A80" stroke-width="5" stroke-linecap="round"/><text x="410" y="445" font-size="28" fill="#124A80" text-anchor="middle" font-weight="700">T : temps de cycle</text><text x="865" y="372" font-size="28" fill="#141414" text-anchor="end" font-weight="700">t</text>
