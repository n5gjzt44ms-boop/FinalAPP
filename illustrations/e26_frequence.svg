><text x="500" y="346" font-size="17" text-anchor="middle" fill="#141414">impulsions par tour</text><polyline points="330,220 330,150" stroke="#141414" stroke-width="1.4" fill="none" stroke-linejoin="round" stroke-linecap="round"/><circle cx="330" cy="220" r="3" stroke="#141414" stroke-width="0.5" fill="#141414"/><text x="330" y="142" font-size="20" text-anchor="middle" fill="#141414">accouplement à clavette</text><text x="450" y="420" font-size="19" text-anchor="middle" fill="#185FA5">Fréquence de sortie maxi : 100 kHz (TTL ou HTL)</text><text x="450" y="448" font-size="19" text-anchor="middle" fill="#185FA5">Vitesse mécanique maxi : 4 000 tr/min</text>
