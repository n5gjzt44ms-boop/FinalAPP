<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 440" role="img" aria-label="Vérin de flèche tenu par une valve d équilibrage à trois orifices">
<rect width="900" height="440" fill="#FFFFFF"/>
<g font-family="Arial,Helvetica,sans-serif">
<text x="450" y="44" font-size="30" fill="#124A80" text-anchor="middle" font-weight="700">Valve d&#8217;équilibrage sur un vérin de flèche</text><rect x="120" y="120" width="110" height="230" fill="#E8E4DA" stroke="#141414" stroke-width="4" rx="0"/><rect x="124" y="180" width="102" height="20" fill="#D6D6D2" stroke="#141414" stroke-width="4" rx="0"/><line x1="175" y1="180" x2="175" y2="90" stroke="#141414" stroke-width="10"/><rect x="130" y="72" width="90" height="20" fill="#C13B3A" stroke="#C13B3A" stroke-width="2" rx="0"/><text x="240" y="90" font-size="20" fill="#C13B3A" text-anchor="start">Charge</text><rect x="400" y="200" width="150" height="110" fill="#E8E4DA" stroke="#141414" stroke-width="4" rx="8"/><text x="475" y="262" font-size="22" fill="#141414" text-anchor="middle">Valve</text><text x="488" y="192" font-size="22" fill="#141414" text-anchor="start" font-weight="700">1</text><line x1="475" y1="170" x2="475" y2="200" stroke="#141414" stroke-width="4"/><text x="488" y="336" font-size="22" fill="#141414" text-anchor="start" font-weight="700">2</text><line x1="475" y1="310" x2="475" y2="330" stroke="#141414" stroke-width="4"/><line x1="400" y1="255" x2="370" y2="255" stroke="#141414" stroke-width="3" stroke-dasharray="8 6"/><text x="360" y="262" font-size="22" fill="#141414" text-anchor="end" font-weight="700">3</text><line x1="475" y1="170" x2="475" y2="140" stroke="#141414" stroke-width="4"/><line x1="230" y1="300" x2="300" y2="300" stroke="#141414" stroke-width="4"/><line x1="300" y1="300" x2="300" y2="140" stroke="#141414" stroke-width="4"/><line x1="300" y1="140" x2="475" y2="140" stroke="#141414" stroke-width="4"/><text x="390" y="128" font-size="18" fill="#141414" text-anchor="middle">Chambre qui porte la charge</text><rect x="640" y="340" width="160" height="70" fill="#D6D6D2" stroke="#141414" stroke-width="4" rx="0"/><text x="720" y="383" font-size="20" fill="#141414" text-anchor="middle">Distributeur</text><line x1="475" y1="330" x2="475" y2="375" stroke="#141414" stroke-width="4"/><line x1="475" y1="375" x2="640" y2="375" stroke="#141414" stroke-width="4"/><line x1="370" y1="255" x2="340" y2="255" stroke="#141414" stroke-width="3" stroke-dasharray="8 6"/><line x1="340" y1="255" x2="340" y2="420" stroke="#141414" stroke-width="3" stroke-dasharray="8 6"/><text x="350" y="425" font-size="18" fill="#141414" text-anchor="start">Pilote (autre chambre)</text>
</g>
</svg>
