<text x="450" y="44" font-size="30" fill="#124A80" text-anchor="middle" font-weight="700">Même détecteur, métaux différents</text><rect x="90" y="140" width="120" height="120" fill="#D6D6D2" stroke="#141414" stroke-width="4" rx="0"/><text x="150" y="208" font-size="22" fill="#141414" text-anchor="middle" font-weight="700">Acier</text><text x="150" y="300" font-size="20" fill="#C13B3A" text-anchor="middle">portée ?</text><rect x="240" y="140" width="120" height="120" fill="#FFFFFF" stroke="#141414" stroke-width="4" rx="0"/><text x="300" y="208" font-size="22" fill="#141414" text-anchor="middle" font-weight="700">Inox</text><text x="300" y="300" font-size="20" fill="#C13B3A" text-anchor="middle">portée ?</text><rect x="390" y="140" width="120" height="120" fill="#E8E4DA" stroke="#141414" stroke-width="4" rx="0"/><text x="450" y="208" font-size="22" fill="#141414" text-anchor="middle" font-weight="700">Laiton</text><text x="450" y="300" font-size="20" fill="#C13B3A" text-anchor="middle">portée ?</text><rect x="540" y="140" width="120" height="120" fill="#FFFFFF" stroke="#141414" stroke-width="4" rx="0"/><text x="600" y="208" font-size="22" fill="#141414" text-anchor="middle" font-weight="700">Alu</text><text x="600" y="300" font-size="20" fill="#C13B3A" text-anchor="middle">portée ?</text><rect x="690" y="140" width="120" height="120" fill="#E8E4DA" stroke="#141414" stroke-width="4" rx="0"/><text x="750" y="208" font-size="22" fill="#141414" text-anchor="middle" font-weight="700">Cuivre</text><text x="750" y="300" font-size="20" fill="#C13B3A" text-anchor="middle">portée ?</text><text x="450" y="360" font-size="22" fill="#124A80" text-anchor="middle">Facteur de correction de chaque métal ?</text>
