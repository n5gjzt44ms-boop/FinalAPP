<text x="450" y="44" font-size="30" fill="#124A80" text-anchor="middle" font-weight="700">Accumulateur à vessie, vue en coupe</text><rect x="150" y="140" width="600" height="160" fill="#E8E4DA" stroke="#141414" stroke-width="5" rx="80"/><path d="M200 180 Q190 220 200 260 L640 260 Q690 220 640 180 Z" fill="#FFFFFF" stroke="#185FA5" stroke-width="4"/><text x="420" y="228" font-size="24" fill="#185FA5" text-anchor="middle">Vessie (gaz)</text><rect x="100" y="205" width="50" height="30" fill="#D6D6D2" stroke="#141414" stroke-width="4" rx="0"/><rect x="750" y="195" width="60" height="50" fill="#D6D6D2" stroke="#141414" stroke-width="4" rx="0"/><text x="125" y="120" font-size="22" fill="#141414" text-anchor="middle">Valve de gaz</text><line x1="125" y1="128" x2="125" y2="200" stroke="#141414" stroke-width="3"/><path d="M125 200 L118.8 185.3 L131.2 185.3 Z" fill="#141414"/><text x="780" y="120" font-size="22" fill="#141414" text-anchor="middle">Clapet d&#8217;huile</text><line x1="780" y1="128" x2="780" y2="190" stroke="#141414" stroke-width="3"/><path d="M780 190 L773.8 175.3 L786.2 175.3 Z" fill="#141414"/><text x="450" y="335" font-size="22" fill="#141414" text-anchor="middle">Huile entre vessie et enveloppe</text><text x="450" y="380" font-size="18" fill="#124A80" text-anchor="middle">Dessin couché : la position de montage n&#8217;est pas montrée</text>
