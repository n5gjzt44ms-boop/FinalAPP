<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 430" role="img" aria-label="Contrôleur dont la masse est à raccorder : tôle, moins batterie ou masse d'un relais">
<rect width="900" height="430" fill="#FFFFFF"/>
<g font-family="Arial,Helvetica,sans-serif">
<text x="450" y="46" font-size="30" fill="#124A80" text-anchor="middle" font-weight="700">Où raccorder la masse du contrôleur ?</text><rect x="70" y="170" width="230" height="130" fill="#E8E4DA" rx="10" stroke="#141414" stroke-width="4"/><text x="185" y="244" font-size="26" fill="#141414" text-anchor="middle" font-weight="700">Contrôleur</text><line x1="300" y1="235" x2="450" y2="235" stroke="#141414" stroke-width="7" stroke-linecap="round" stroke-dasharray="14 10"/><text x="380" y="215" font-size="40" fill="#C13B3A" text-anchor="middle" font-weight="700">?</text><rect x="470" y="80" width="340" height="70" fill="#E8E4DA" rx="10" stroke="#141414" stroke-width="4"/><text x="640" y="124" font-size="24" fill="#141414" text-anchor="middle" font-weight="700">Tôle la plus proche</text><rect x="470" y="200" width="340" height="70" fill="#E8E4DA" rx="10" stroke="#141414" stroke-width="4"/><text x="640" y="244" font-size="24" fill="#141414" text-anchor="middle" font-weight="700">Moins (−) de la batterie</text><rect x="470" y="320" width="340" height="70" fill="#E8E4DA" rx="10" stroke="#141414" stroke-width="4"/><text x="640" y="364" font-size="24" fill="#141414" text-anchor="middle" font-weight="700">Masse du relais de vanne</text>
</g>
</svg>
