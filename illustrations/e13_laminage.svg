<g font-family="Arial,Helvetica,sans-serif">
<text x="450" y="44" font-size="30" fill="#124A80" text-anchor="middle" font-weight="700">Où placer la ligne de pliage ?</text><rect x="120" y="90" width="660" height="250" fill="#E8E4DA" stroke="#141414" stroke-width="4" rx="0"/><line x1="160" y1="320" x2="360" y2="320" stroke="#185FA5" stroke-width="4"/><path d="M360 320 L345.3 326.2 L345.3 313.8 Z" fill="#185FA5"/><text x="380" y="328" font-size="22" fill="#185FA5" text-anchor="start">Sens de laminage</text><rect x="560" y="210" width="170" height="50" fill="#D6D6D2" stroke="#141414" stroke-width="2" rx="0"/><text x="645" y="243" font-size="20" fill="#141414" text-anchor="middle" font-weight="700">MARQUAGE</text><line x1="300" y1="100" x2="300" y2="300" stroke="#C13B3A" stroke-width="4" stroke-dasharray="14 8"/><text x="300" y="80" font-size="22" fill="#C13B3A" text-anchor="middle" font-weight="700">Ligne A</text><line x1="130" y1="155" x2="770" y2="155" stroke="#124A80" stroke-width="4" stroke-dasharray="14 8"/><text x="160" y="140" font-size="22" fill="#124A80" text-anchor="start" font-weight="700">Ligne B</text><text x="450" y="380" font-size="22" fill="#141414" text-anchor="middle">Bords cisaillés ou oxycoupés : à préparer</text>
</g>
