<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 460" role="img" aria-label="Capteur relié à un contrôleur par le 5 volts, le signal et la masse, avec un voltmètre">
<rect width="900" height="460" fill="#FFFFFF"/>
<g font-family="Arial,Helvetica,sans-serif">
<text x="450" y="46" font-size="30" fill="#124A80" text-anchor="middle" font-weight="700">Capteur à trois fils sur le contrôleur</text><rect x="70" y="150" width="190" height="210" fill="#E8E4DA" rx="10" stroke="#141414" stroke-width="4"/><text x="165" y="264" font-size="26" fill="#141414" text-anchor="middle" font-weight="700">Capteur</text><rect x="640" y="150" width="190" height="210" fill="#E8E4DA" rx="10" stroke="#141414" stroke-width="4"/><text x="735" y="264" font-size="26" fill="#141414" text-anchor="middle" font-weight="700">Contrôleur</text><line x1="260" y1="190" x2="640" y2="190" stroke="#C13B3A" stroke-width="7" stroke-linecap="round"/><text x="450" y="178" font-size="24" fill="#C13B3A" text-anchor="middle" font-weight="700">+5 V</text><line x1="260" y1="255" x2="640" y2="255" stroke="#185FA5" stroke-width="7" stroke-linecap="round"/><text x="450" y="243" font-size="24" fill="#185FA5" text-anchor="middle" font-weight="700">Signal</text><line x1="260" y1="320" x2="640" y2="320" stroke="#141414" stroke-width="7" stroke-linecap="round"/><text x="450" y="308" font-size="24" fill="#141414" text-anchor="middle" font-weight="700">Masse capteur</text><circle cx="345" cy="410" r="34" fill="#FFFFFF" stroke="#141414" stroke-width="5"/><text x="345" y="420" font-size="30" fill="#141414" text-anchor="middle" font-weight="700">V</text><line x1="345" y1="376" x2="345" y2="190" stroke="#141414" stroke-width="3" stroke-linecap="round" stroke-dasharray="8 6"/>
</g>
</svg>
